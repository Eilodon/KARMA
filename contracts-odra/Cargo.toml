[package]
name = "karma-odra"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "KARMA AgentSkillRegistry — Odra port for Casper Network (Casper Agentic Buildathon T9)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pin EXACT version (=2.8.1) to prevent silent Odra-macros churn between local builds and CI
# (the risk register flagged this as Odra version churn — mitigation: pin in Cargo.toml).
# Bump deliberately; do not relax to a caret range.
odra = { version = "=2.9.0", default-features = false }

[build-dependencies]
odra-build = "=2.8.2"

[dev-dependencies]
odra-test = "=2.8.2"

# WASM compilation for Casper deployment: run `./build-wasm.sh`, not `cargo odra build` (the
# cargo-odra 0.1.7 CLI doesn't match this odra-build API version — see contracts-odra/README.md
# § "wasm32 build — how this actually works" for the full diagnosis and the working recipe).

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
